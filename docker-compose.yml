services:
  postgres:
    image: postgres:17-alpine
    container_name: reveria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reveria
      POSTGRES_USER: reveria
      POSTGRES_PASSWORD: reveria
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - reveria-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reveria -d reveria"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - reveria-net

  reveria-api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: reveria-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=4100
      - DATABASE_TYPE=postgres
      - DATABASE_URL=host=reveria-postgres user=reveria password=reveria dbname=reveria port=5432 sslmode=disable
      - REVERIA_ENV=production
      - JWT_SECRET=${REVERIA_SECRET_KEY:?REVERIA_SECRET_KEY must be set}
      - REVERIA_ALLOWED_ORIGINS=${REVERIA_ALLOWED_ORIGINS:-http://127.0.0.1:14200}
    ports:
      - "127.0.0.1:14100:4100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4100/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    volumes:
      - ./services/api/storage/uploads:/app/storage/uploads
    networks:
      - reveria-net

  reveria-web:
    build:
      context: .
      dockerfile: apps/web-next/Dockerfile
    container_name: reveria-web
    restart: unless-stopped
    depends_on:
      reveria-api:
        condition: service_healthy
    environment:
      - API_INTERNAL_URL=http://reveria-api:4100
    ports:
      - "127.0.0.1:14200:3000"
    networks:
      - reveria-net

volumes:
  reveria-postgres-data:

networks:
  reveria-net:
    driver: bridge
